[package]
name = "kicad-hub"
version = "0.1.0"
description = "kicad-hub beside KiCad: what is left before the board can be ordered, in plain words"
authors = ["José Miguel Córdoba Méndez"]
license = "MIT"
repository = "https://github.com/JMcordobamendez/kicad-hub"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
