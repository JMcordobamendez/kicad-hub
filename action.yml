name: kicad-hub
description: ERC/DRC, BOM checks and diff, and fabrication outputs for a KiCad project, using KiBot.
author: JMcordobamendez

inputs:
  project-dir:
    description: >-
      Directory that contains the .kicad_pro file, relative to the repository root. Empty
      (the default) = the only .kicad_pro in the repository; set it when there are several.
    required: false
    default: ""
  strict:
    description: >-
      Fail the job when ERC or DRC report errors, or a requirement fails. Keep false while
      the design is in progress.
    default: "false"
  required-fields:
    description: >-
      Symbol fields every fitted part must have, comma-separated. "A|B" means A or B is
      enough (e.g. an MPN or a distributor part number). DNP parts are skipped.
    default: "Footprint,Datasheet,MPN|LCSC"
  check-capacitor-voltage:
    description: Require a voltage rating on capacitors (a "Voltage" field, or a value like "10uF 16V").
    default: "true"
  datasheet-dirs:
    description: >-
      Extra folders (comma-separated, from the repo root) with datasheet files. Always
      searched too: datasheet(s)/ and docs/ next to the project, and datasheet(s)/ one
      level up. A file is used when its name contains the part's MPN or value.
    default: ""
  datasheet-optional-refs:
    description: Reference prefixes that don't need a datasheet (generic parts).
    default: "R,C,TP,H,MH,FID,JP,NT,LOGO"
  check-datasheet-links:
    description: Check that datasheet URLs respond (404 = broken; sites that block bots = unverified).
    default: "true"
  variants:
    description: >-
      KiCad design variants to build: "auto" (all defined in the project), a
      comma-separated list of names, or "none".
    default: auto
  sourcing:
    description: >-
      Price and stock of the fitted parts from several suppliers, and a page to compare
      them. LCSC and JLCPCB need no key (looked up by the LCSC field); Mouser, Farnell
      and DigiKey are used when their keys are given (looked up by MPN).
    default: "true"
  boards:
    description: Batch sizes to price, comma-separated (components only).
    default: "1,5,10,100"
  currency:
    description: Currency for all prices (ISO code; converted with ECB rates).
    default: USD
  sourcing-choices:
    description: >-
      Supplier picked per part (CSV: Part,Supplier,SKU), relative to project-dir.
      Download it from the comparison page; parts not in it use the cheapest offer.
    default: kicad-hub-sourcing.csv
  mouser-api-key:
    description: Mouser Search API key (pass a secret). Empty = Mouser not used.
    default: ""
  farnell-api-key:
    description: Farnell / element14 API key (pass a secret). Empty = Farnell not used.
    default: ""
  farnell-store:
    description: Farnell store to price from (e.g. uk.farnell.com, es.farnell.com, www.newark.com).
    default: uk.farnell.com
  digikey-client-id:
    description: DigiKey API client ID (pass a secret). Empty = DigiKey not used.
    default: ""
  digikey-client-secret:
    description: DigiKey API client secret (pass a secret).
    default: ""
  requirements:
    description: >-
      Requirements file (YAML), relative to project-dir, checked against ERC, DRC, BOM and
      prices. Missing file = no requirements checked.
    default: kicad-hub-requirements.yaml
  pages:
    description: >-
      Publish a design portal page per branch, release and pull request (schematic and
      PCB viewer, report, interactive BOM, suppliers, downloads) to the pages-branch,
      for GitHub Pages. Needs contents write; enable Pages on that branch once.
    default: "true"
  pages-branch:
    description: Branch the portal is published to (Settings → Pages → Deploy from a branch).
    default: kicad-hub-site
  history:
    description: >-
      Timeline of the default branch: keep a light snapshot (design files, per-page renders,
      parts BOM, commit info) of the last N commits under history/<sha>/ in the portal, to
      browse and compare them (compare.html). 0 = off. Needs pages.
    default: "10"
  pr-commits:
    description: >-
      Commits of a pull request: on every push to a PR, keep a light snapshot of its head commit
      (same content as the history snapshots) under pr-<N>/commits/<sha7>/ in the portal, the
      newest N per PR, so any two pushes of the same PR can be compared (compare.html, the PR
      page, the activity page). Removed with the PR's page when it closes. 0 = off. Needs pages.
    default: "20"
  activity:
    description: >-
      Activity page of the portal (activity.html): graph of the last N commits of all
      branches and tags, who created each branch, pull requests with their reviews and
      comments, releases, and who pushed (recorded from the first run on, GitHub doesn't
      keep it). No e-mail addresses are published. Needs pages; the token reads the PRs.
      0 = off.
    default: "500"
  visual-diff:
    description: >-
      On pull requests, before/after images of the changed schematic sheets and PCB
      layers, shown in the PR comment (images are kept in the kicad-hub-images branch,
      needs contents write).
    default: "true"
  fab-profile:
    description: >-
      Optional fab layer on top of the generic package: generic, jlcpcb, pcbway or eurocircuits.
      Adds a DRC run with that fab's rules (the project's own DRC is unchanged) and, for
      JLCPCB, BOM and pick & place in its column layout.
    default: generic
  extra-formats:
    description: Extra board formats for the fab package, comma-separated (odb, ipc2581).
    default: ""
  release:
    description: On tags, publish the fab package as a GitHub Release asset (needs contents write).
    default: "true"
  comment:
    description: On pull requests, post the report as a comment (updated on every push).
    default: "true"
  github-token:
    description: Token used to comment on the pull request. Needs pull-requests write permission.
    default: ${{ github.token }}
  image:
    description: KiBot Docker image (headless KiCad).
    default: ghcr.io/inti-cmnb/kicad10_auto:1.9.1
  output-dir:
    description: Where outputs are written, relative to the repository root.
    default: fab

outputs:
  has-pcb:
    description: "true when the PCB has a board outline and PCB outputs were generated."
    value: ${{ steps.detect.outputs.has_pcb }}
  missing-fields:
    description: Number of fitted parts missing a required field.
    value: ${{ steps.report.outputs.missing_fields }}
  requirements-failed:
    description: Number of failed requirements ("-" when there is no requirements file).
    value: ${{ steps.report.outputs.requirements_failed }}

runs:
  using: composite
  steps:
    - name: Detect project
      id: detect
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        OUT: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        # project-dir, or the only .kicad_pro in the repository; a board with nothing on
        # Edge.Cuts is still being drawn (has_pcb=false: no PCB checks or outputs)
        python3 "$GITHUB_ACTION_PATH/scripts/detect.py" --project-dir "$PROJECT_DIR" --exclude "$OUT" >> "$GITHUB_OUTPUT"

    - name: Pull KiBot image
      shell: bash
      run: docker pull --quiet "${{ inputs.image }}"

    - name: Register KiCad standard libraries
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        # kicad-cli starts with an empty config in a fresh container, so every symbol and
        # footprint from the standard libraries is reported as "library not found".
        # Give it the stock global lib tables in a HOME shared by all later steps.
        mkdir -p "$RUNNER_TEMP/kicad-home"
        docker run --rm -u "$(id -u):$(id -g)" -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" "$IMAGE" sh -c '
          for t in sym-lib-table fp-lib-table; do
            src=$(ls /usr/share/kicad/template/$t /usr/share/kicad/$t 2>/dev/null | head -n 1)
            [ -n "$src" ] || { echo "missing $t"; continue; }
            for v in $(ls /usr/share/kicad 2>/dev/null | grep -E "^[0-9]+\.[0-9]+$" || true) 10.0; do
              mkdir -p "$HOME/.config/kicad/$v" && cp "$src" "$HOME/.config/kicad/$v/"
            done
          done' | tee "$RUNNER_TEMP/kicad-libs.log"
        if grep -q missing "$RUNNER_TEMP/kicad-libs.log"; then
          echo "::warning::Standard KiCad library tables not found in $IMAGE: ERC/DRC will report library warnings"
        fi

    - name: ERC / DRC
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        PROFILE: ${{ inputs.fab-profile }}
      run: |
        set -euo pipefail
        # ERC, DRC with schematic parity, and a second DRC with the fab's rules added to a
        # copy of the project when fab-profile is set. The engine: scripts/kicad_hub.py
        python3 "$GITHUB_ACTION_PATH/scripts/kicad_hub.py" checks --project-dir "$PROJECT_DIR" --out "$OUT" \
          --fab-profile "$PROFILE" --image "$IMAGE" --kicad-home "$RUNNER_TEMP/kicad-home" --tmp "$RUNNER_TEMP"

    - name: Per-part BOM (this commit and PR base)
      id: bom
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        REQUIRED: ${{ inputs.required-fields }}
        VARIANTS: ${{ inputs.variants }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        # One row per part (virtual symbols such as PWR_FLAG dropped), the same for every
        # design variant (variants.json) and, on pull requests, for the target branch, for
        # the diff. The engine: scripts/kicad_hub.py
        base=()
        [ -z "$BASE_SHA" ] || base=(--base "$BASE_SHA" --fetch)
        python3 "$GITHUB_ACTION_PATH/scripts/kicad_hub.py" bom --project-dir "$PROJECT_DIR" --out "$OUT" \
          --required-fields "$REQUIRED" --variants "$VARIANTS" ${base[@]+"${base[@]}"} \
          --image "$IMAGE" --kicad-home "$RUNNER_TEMP/kicad-home"

    - name: Visual diff (pull requests)
      if: github.event_name == 'pull_request' && inputs.visual-diff == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        NAME: ${{ steps.detect.outputs.name }}
        HAS_PCB: ${{ steps.detect.outputs.has_pcb }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        run() { docker run --rm -u "$(id -u):$(id -g)" -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -w /w "$IMAGE" "$@"; }
        vis="$OUT/visual"; svg="$OUT/.visual-svg"; base_dir=.kicad-hub-base
        mkdir -p "$vis" "$svg"
        echo "[]" > "$OUT/reports/visual.json"
        if ! git worktree add --detach "$base_dir" "$BASE_SHA"; then
          echo "::warning::Could not check out the PR base: visual diff skipped"
          exit 0
        fi

        # Same export options for both sides, so unchanged pages give identical pixels
        sch_svg() { [ -f "$1/$PROJECT_DIR/$NAME.kicad_sch" ] && run kicad-cli sch export svg -o "$2" "$1/$PROJECT_DIR/$NAME.kicad_sch"; }
        # Copper layers of this board (from its layer table), silkscreen and outline.
        # Black and white: theme colours like the cream silkscreen vanish on white.
        layers=$(grep -oP '^\s*\(\d+ "\K[^"]*\.Cu(?=" )' "$PROJECT_DIR/$NAME.kicad_pcb" 2>/dev/null | paste -sd, -)
        layers="${layers:+$layers,}F.Silkscreen,B.Silkscreen,Edge.Cuts"
        pcb_svg() {
          [ -f "$1/$PROJECT_DIR/$NAME.kicad_pcb" ] && run kicad-cli pcb export svg --mode-multi --layers "$layers" \
            --black-and-white --exclude-drawing-sheet --page-size-mode 0 -o "$2" "$1/$PROJECT_DIR/$NAME.kicad_pcb"
        }
        cp "$GITHUB_ACTION_PATH/scripts/visual_diff.py" "$OUT/.visual_diff.py"
        diff_kind() {  # $1 sch|pcb
          mkdir -p "$svg/$1-base" "$svg/$1-head"
          "${1}_svg" "$base_dir" "$svg/$1-base/" > /dev/null || true
          "${1}_svg" . "$svg/$1-head/" > /dev/null || true
          run python3 "$OUT/.visual_diff.py" --kind "$1" --base "$svg/$1-base" --head "$svg/$1-head" \
            --prefix "$NAME" --out "$vis" --json "$OUT/reports/visual.json"
        }
        diff_kind sch
        [ "$HAS_PCB" != true ] || diff_kind pcb
        rm -rf "$svg" "$OUT/.visual_diff.py"
        git worktree remove --force "$base_dir"

        if [ "$(jq length "$OUT/reports/visual.json")" = 0 ]; then
          rmdir "$vis" 2>/dev/null || true
          exit 0
        fi
        # A PR comment can only show images that have a URL: keep them in a branch of
        # this repo (one folder per PR, replaced on every push) and link them by commit,
        # so older versions of the comment keep working.
        branch=kicad-hub-images
        wt="$RUNNER_TEMP/kicad-hub-images"
        sha=""
        for try in 1 2 3; do
          git worktree remove --force "$wt" 2>/dev/null || true
          if git fetch --no-tags --depth=1 origin "$branch" 2>/dev/null; then
            git worktree add --detach "$wt" FETCH_HEAD > /dev/null
          else
            git worktree add --detach "$wt" > /dev/null && git -C "$wt" checkout -q --orphan "images-$try" &&git -C "$wt" rm -rqf .
          fi
          # only what the comment shows; the full before/after pages go to the portal
          rm -rf "$wt/pr-$PR" && mkdir -p "$wt/pr-$PR" &&
            find "$vis" -maxdepth 1 -name '*.png' ! -name '*-before.png' ! -name '*-after.png' -exec cp {} "$wt/pr-$PR/" \;
          git -C "$wt" add -A
          # a re-run of the same commit has the same images: nothing to commit
          git -C "$wt" diff --cached --quiet ||
            git -C "$wt" -c user.name="github-actions[bot]" \
              -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
              commit -qm "PR #$PR: visual diff of ${HEAD_SHA:0:7}"
          if git -C "$wt" push -q origin "HEAD:refs/heads/$branch"; then
            sha=$(git -C "$wt" rev-parse HEAD)
            break
          fi
        done
        git worktree remove --force "$wt" 2>/dev/null || true
        if [ -n "$sha" ]; then
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$sha/pr-$PR"
          jq --arg u "$url" 'map(.url = "\($u)/\(.image)" | .full_url = "\($u)/\(.full)")' \
            "$OUT/reports/visual.json" > "$OUT/reports/visual.tmp" && mv "$OUT/reports/visual.tmp" "$OUT/reports/visual.json"
        else
          echo "::warning::Could not push the visual diff images (the workflow needs 'contents: write'): they are in the artifact only"
        fi

    - name: Datasheets
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        OUT: ${{ inputs.output-dir }}
        DIRS: ${{ inputs.datasheet-dirs }}
        CHECK: ${{ inputs.check-datasheet-links }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/kicad_hub.py" datasheets --project-dir "$PROJECT_DIR" --out "$OUT" \
          --dirs "$DIRS" --check-links "$CHECK"

    - name: Cost and stock
      if: inputs.sourcing == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        OUT: ${{ inputs.output-dir }}
        BOARDS: ${{ inputs.boards }}
        CURRENCY: ${{ inputs.currency }}
        CHOICES: ${{ inputs.sourcing-choices }}
        MOUSER_API_KEY: ${{ inputs.mouser-api-key }}
        FARNELL_API_KEY: ${{ inputs.farnell-api-key }}
        FARNELL_STORE: ${{ inputs.farnell-store }}
        DIGIKEY_CLIENT_ID: ${{ inputs.digikey-client-id }}
        DIGIKEY_CLIENT_SECRET: ${{ inputs.digikey-client-secret }}
      run: |
        set -euo pipefail
        # a supplier that fails is a warning inside the engine, never a failed job
        python3 "$GITHUB_ACTION_PATH/scripts/kicad_hub.py" sourcing --project-dir "$PROJECT_DIR" --out "$OUT" \
          --boards "$BOARDS" --currency "$CURRENCY" --choices "$CHOICES"

    - name: Fab package
      id: package
      if: steps.detect.outputs.has_pcb == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        EXTRA: ${{ inputs.extra-formats }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        PROFILE: ${{ inputs.fab-profile }}
      run: |
        set -euo pipefail
        # Standard formats any fab accepts (Gerber X2, Excellon, IPC-D-356), BOM and pick &
        # place of the default build and of each variant, fab notes read from the board,
        # checksums and the zip. Revision: the tag on releases, else the board's title
        # block, else the commit. The engine sets the outputs rev, board_rev, zip and name.
        rev=()
        [ "$REF_TYPE" != tag ] || rev=(--rev "$REF_NAME")
        python3 "$GITHUB_ACTION_PATH/scripts/kicad_hub.py" package --project-dir "$PROJECT_DIR" --out "$OUT" \
          --fab-profile "$PROFILE" --extra-formats "$EXTRA" ${rev[@]+"${rev[@]}"} \
          --image "$IMAGE" --kicad-home "$RUNNER_TEMP/kicad-home"

    - name: Requirements
      id: requirements
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        OUT: ${{ inputs.output-dir }}
        REQ: ${{ inputs.requirements }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -uo pipefail
        file="$PROJECT_DIR/$REQ"
        if [ -z "$REQ" ] || [ ! -f "$file" ]; then
          echo "No requirements file ($file): skipped"
          exit 0
        fi
        # In the KiBot image, which has PyYAML (the runner's Python may not)
        cp "$GITHUB_ACTION_PATH/scripts/requirements.py" "$OUT/.requirements.py"
        docker run --rm -u "$(id -u):$(id -g)" -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -v "$PWD:/w" -w /w "$IMAGE"           python3 "$OUT/.requirements.py" "$file" "$OUT/reports" "$OUT/reports/requirements.json"           || echo "::warning::Requirements check failed to run: skipped"
        rm -f "$OUT/.requirements.py"

    - name: Portal address
      id: portal
      # pushes and PRs from this repo (a fork's PR can't write to the site branch)
      if: >-
        inputs.pages == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository))
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        PR: ${{ github.event.pull_request.number }}
        HISTORY: ${{ inputs.history }}
        PR_COMMITS: ${{ inputs.pr-commits }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -n "$PR" ]; then
          dest="pr-$PR"; label="PR #$PR"; kind=pr
        elif [ "$REF_TYPE" = tag ]; then
          dest="releases/$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '_')"; label="$REF_NAME"; kind=release
        else
          dest=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '_'); label="$REF_NAME"; kind=branch
          case "$dest" in pr-*|releases) dest="branch-$dest" ;; esac
        fi
        owner=${GITHUB_REPOSITORY%%/*}; repo=${GITHUB_REPOSITORY#*/}
        if [ "${repo,,}" = "${owner,,}.github.io" ]; then base="https://${repo,,}"; else base="https://${owner,,}.github.io/$repo"; fi
        # a light snapshot of every push to the default branch, for the timeline
        hist_dest=""
        if [ "$kind" = branch ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && [ "${HISTORY:-0}" -gt 0 ] 2>/dev/null; then
          hist_dest="history/${GITHUB_SHA:0:7}"
        fi
        # a light snapshot of every push to a pull request, to compare its commits with each other
        pr_dest=""
        if [ "$kind" = pr ] && [ "${PR_COMMITS:-0}" -gt 0 ] 2>/dev/null; then
          pr_dest="pr-$PR/commits/${PR_HEAD_SHA:0:7}"
        fi
        { echo "dest=$dest"; echo "label=$label"; echo "kind=$kind"; echo "url=$base/$dest/"; echo "base=$base/"; echo "history_dest=$hist_dest"; echo "pr_commit_dest=$pr_dest"; } >> "$GITHUB_OUTPUT"

    - name: Pages check
      id: pages_state
      if: steps.portal.outputs.dest != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.pages-branch }}
      run: |
        # Is Pages serving the portal branch? If not (private repo without a paid plan, or not
        # enabled yet) the report explains it instead of linking to a 404. Never fails.
        echo "state=$(python3 "$GITHUB_ACTION_PATH/scripts/pages_status.py" 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

    - name: Page renders (compare)
      if: steps.portal.outputs.dest != ''
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        NAME: ${{ steps.detect.outputs.name }}
        HAS_PCB: ${{ steps.detect.outputs.has_pcb }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -uo pipefail
        # Every published build stores a full-page PNG of each schematic sheet and PCB layer,
        # made with the same export options and resolution (scripts/renders.py, no crop that
        # depends on the content), so the portal's compare page can diff any two builds.
        r="$RUNNER_TEMP/kicad-hub-renders"
        rm -rf "$r" && mkdir -p "$r/png" "$r/svg/sch" "$r/svg/pcb" || exit 0
        run() { docker run --rm -u "$(id -u):$(id -g)" -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -v "$r:/r" -w /w "$IMAGE" "$@"; }
        cp "$GITHUB_ACTION_PATH/scripts/renders.py" "$r/renders.py"
        # same export options as the visual diff (see that step)
        run kicad-cli sch export svg -o /r/svg/sch/ "$PROJECT_DIR/$NAME.kicad_sch" > /dev/null \
          && run python3 /r/renders.py --kind sch --svg /r/svg/sch --prefix "$NAME" --out /r/png \
          || echo "::warning::Schematic renders for the compare page skipped"
        if [ "$HAS_PCB" = true ]; then
          layers=$(grep -oP '^\s*\(\d+ "\K[^"]*\.Cu(?=" )' "$PROJECT_DIR/$NAME.kicad_pcb" 2>/dev/null | paste -sd, -)
          layers="${layers:+$layers,}F.Silkscreen,B.Silkscreen,Edge.Cuts"
          run kicad-cli pcb export svg --mode-multi --layers "$layers" --black-and-white --exclude-drawing-sheet \
            --page-size-mode 0 -o /r/svg/pcb/ "$PROJECT_DIR/$NAME.kicad_pcb" > /dev/null \
            && run python3 /r/renders.py --kind pcb --svg /r/svg/pcb --prefix "$NAME" --out /r/png \
            || echo "::warning::PCB renders for the compare page skipped"
        fi
        rm -rf "$r/svg" "$r/renders.py"
        du -sh "$r/png" 2>/dev/null || true

    - name: Report
      id: report
      shell: bash
      env:
        NAME: ${{ steps.detect.outputs.name }}
        OUT: ${{ inputs.output-dir }}
        REQUIRED: ${{ inputs.required-fields }}
        CAP_VOLTAGE: ${{ inputs.check-capacitor-voltage }}
        DS_OPTIONAL: ${{ inputs.datasheet-optional-refs }}
        PACKAGE: ${{ steps.package.outputs.name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PORTAL_URL: ${{ steps.portal.outputs.url }}
        PORTAL_STATE: ${{ steps.pages_state.outputs.state }}
        PAGES_BRANCH: ${{ inputs.pages-branch }}
        ACTION_REF: ${{ github.action_ref }}
        FAB_PROFILE: ${{ inputs.fab-profile }}
      run: |
        set -euo pipefail
        r="$OUT/reports"
        python3 "$GITHUB_ACTION_PATH/scripts/report.py" \
          --name "$NAME" --bom "$r/bom-parts.csv" --base-bom "$r/bom-parts-base.csv" --base-ref "${BASE_REF:-base}" \
          --erc "$r/erc.json" --drc "$r/drc.json" --drc-fab "$r/drc-fab.json" --fab-profile "$FAB_PROFILE" \
          --required "$REQUIRED" --cap-voltage "$CAP_VOLTAGE" \
          --datasheets "$r/datasheets.json" --datasheet-optional "$DS_OPTIONAL" \
          --package "$PACKAGE" --package-warnings "$r/fab-warnings.txt" \
          --variants "$r/variants.json" --variant-sync "$r/variant-sync.json" --requirements "$r/requirements.json" --visual "$r/visual.json" --sourcing "$r/sourcing.json" \
          --portal-url "$PORTAL_URL" --portal-state "${PORTAL_STATE:-unknown}" \
          --pages-branch "$PAGES_BRANCH" --pages-settings-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages" --action-ref "$ACTION_REF" \
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --out "$r/report.md" --out-json "$r/counts.json"
        cat "$r/report.md" >> "$GITHUB_STEP_SUMMARY"
        for k in erc_errors drc_errors missing_fields requirements_failed; do
          echo "$k=$(jq -r ".$k // \"-\"" "$r/counts.json")" >> "$GITHUB_OUTPUT"
        done

    - name: Comment on pull request
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NAME: ${{ steps.detect.outputs.name }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ inputs.output-dir }}/reports/report.md
      run: |
        set -uo pipefail
        # One comment per board, edited on every push instead of piling up new ones
        marker="<!-- kicad-hub:$NAME -->"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$REPORT" > /dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$REPORT" > /dev/null
        fi || echo "::warning::Could not comment on the PR (the workflow needs 'pull-requests: write' permission)"

    - name: Outputs (KiBot)
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        NAME: ${{ steps.detect.outputs.name }}
        HAS_PCB: ${{ steps.detect.outputs.has_pcb }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        CONFIG: ${{ github.action_path }}/kibot/default.kibot.yaml
      run: |
        set -euo pipefail
        # The action's own files are outside the workspace that gets mounted in the container
        cp "$CONFIG" "$OUT/.kibot.yaml"
        # Gerbers, drill and pick & place live in the fab package (previous step)
        targets="schematic_pdf bom_csv bom_html"
        pcb_args=()
        if [ "$HAS_PCB" = true ]; then
          targets="$targets ibom"
          pcb_args=(-b "$PROJECT_DIR/$NAME.kicad_pcb")
        fi
        # -s all: ERC/DRC already ran in a previous step. These outputs are extras: if
        # KiBot can't load the design, say why and carry on, so the report, artifact and
        # portal are still published.
        if ! docker run --rm -u "$(id -u):$(id -g)" -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -w /w "$IMAGE" \
          kibot -c "$OUT/.kibot.yaml" -e "$PROJECT_DIR/$NAME.kicad_sch" "${pcb_args[@]}" \
                -d "$OUT" -s all $targets 2>&1 | tee "$OUT/reports/kibot.log"; then
          why=$(grep -E '^ERROR:' "$OUT/reports/kibot.log" | sed 's/^ERROR://; s/ (kibot[^)]*)$//' | tail -n 1)
          echo "::warning::KiBot outputs (schematic PDF, BOM HTML, iBOM) skipped: ${why:-see reports/kibot.log}"
        fi
        rm "$OUT/.kibot.yaml"

    - name: Publish design portal
      if: steps.portal.outputs.dest != ''
      shell: bash
      env:
        PROJECT_DIR: ${{ steps.detect.outputs.dir }}
        NAME: ${{ steps.detect.outputs.name }}
        OUT: ${{ inputs.output-dir }}
        BRANCH: ${{ inputs.pages-branch }}
        DEST: ${{ steps.portal.outputs.dest }}
        LABEL: ${{ steps.portal.outputs.label }}
        KIND: ${{ steps.portal.outputs.kind }}
        URL: ${{ steps.portal.outputs.url }}
        PORTAL_STATE: ${{ steps.pages_state.outputs.state }}
        REV: ${{ steps.package.outputs.board_rev }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TITLE: ${{ github.event.pull_request.title }}
        REF_NAME: ${{ github.ref_name }}
        HISTORY: ${{ inputs.history }}
        HIST_DEST: ${{ steps.portal.outputs.history_dest }}
        PR_COMMIT_DEST: ${{ steps.portal.outputs.pr_commit_dest }}
        PR_COMMITS: ${{ inputs.pr-commits }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ACTIVITY: ${{ inputs.activity }}
        GH_TOKEN: ${{ inputs.github-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_NAME: ${{ github.event_name }}
        PR_ACTION: ${{ github.event.action }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        ACTOR: ${{ github.actor }}
        EVENT_REF: ${{ github.ref }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_AFTER: ${{ github.event.after }}
      run: |
        set -uo pipefail
        site="$RUNNER_TEMP/kicad-hub-portal"
        rm -rf "$site"
        # Activity page: read git (full history, all branches) and GitHub once, here; the push
        # log is appended to the site branch inside the publish loop (scripts/activity.py)
        act_raw="$RUNNER_TEMP/kicad-hub-activity.json"
        rm -f "$act_raw"
        act=0
        case "$ACTIVITY" in ''|*[!0-9]*) ;; *) act=$ACTIVITY ;; esac
        activity=(); push=()
        if [ "$act" -gt 0 ]; then
          activity=(--activity)
          python3 "$GITHUB_ACTION_PATH/scripts/activity.py" collect --out "$act_raw" --repo "$GITHUB_REPOSITORY"             --server "$GITHUB_SERVER_URL" --limit "$act" --default-branch "$DEFAULT_BRANCH"             --exclude "$BRANCH,kicad-hub-images" --deepen || true
          if [ "$EVENT_NAME" = push ]; then
            push=(--push-actor "$ACTOR" --push-ref "$EVENT_REF" --push-before "$EVENT_BEFORE" --push-after "$EVENT_AFTER")
          elif [ "$EVENT_NAME" = pull_request ] && [ "$PR_ACTION" = synchronize ]; then
            push=(--push-actor "$ACTOR" --push-ref "refs/heads/$PR_HEAD_REF" --push-before "$EVENT_BEFORE" --push-after "$EVENT_AFTER")
          fi
        fi
        # commit of this build (a PR is checked out as a merge commit: nothing to say there)
        commit=()
        if [ "$KIND" != pr ]; then
          # (--opt=value: a message starting with "-" is still a value)
          commit=(--commit-date="$(git log -1 --format=%cI)" --commit-author="$(git log -1 --format=%an)" --commit-message="$(git log -1 --format=%s)")
        fi
        renders=()
        [ -f "$RUNNER_TEMP/kicad-hub-renders/png/renders.json" ] && renders=(--renders "$RUNNER_TEMP/kicad-hub-renders/png")
        branch=""; [ "$KIND" = branch ] && branch="$REF_NAME"
        portal() { python3 "$GITHUB_ACTION_PATH/scripts/portal.py" build --out "$OUT" \
          --project-dir "$PROJECT_DIR" --name "$NAME" --rev "$REV" --sha "$SHA" --repo "$GITHUB_REPOSITORY" \
          --server "$GITHUB_SERVER_URL" --title "$TITLE" --base-ref "$BASE_REF" --branch "$branch" \
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "${commit[@]}" "${renders[@]}" "${activity[@]}" "$@"; }
        portal --site "$site" --label "$LABEL" --kind "$KIND"
        # light snapshot of this commit for the timeline (default branch only)
        hist=""
        if [ -n "$HIST_DEST" ]; then
          hist="$RUNNER_TEMP/kicad-hub-portal-history"
          rm -rf "$hist"
          portal --site "$hist" --label "${SHA:0:7}" --kind history --light || hist=""
        fi
        # light snapshot of the head commit of this push (pull requests): its own commit info, which
        # the checkout (the PR merged into its base) doesn't have; the head may need fetching
        prc=""
        if [ -n "$PR_COMMIT_DEST" ]; then
          prc="$RUNNER_TEMP/kicad-hub-portal-prcommit"
          rm -rf "$prc"
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$SHA" 2>/dev/null || true
          pc=()
          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            pc=(--commit-date="$(git log -1 --format=%cI "$SHA")" --commit-author="$(git log -1 --format=%an "$SHA")" --commit-message="$(git log -1 --format=%s "$SHA")")
          fi
          portal --site "$prc" --label "PR #$PR_NUMBER · ${SHA:0:7}" --kind commit --pr "$PR_NUMBER" --light "${pc[@]}" || prc=""
        fi
        case "$HISTORY" in ''|*[!0-9]*) keep=-1 ;; *) keep=$HISTORY ;; esac
        case "$PR_COMMITS" in ''|*[!0-9]*) keep_pr=-1 ;; *) keep_pr=$PR_COMMITS ;; esac
        # The site branch is one commit, replaced on every publish (no history of zips and
        # PDFs piling up). --force-with-lease keeps concurrent runs from losing each other's
        # pages: the loser retries on top of the winner.
        wt="$RUNNER_TEMP/kicad-hub-site"
        ok=""
        for try in 1 2 3; do
          git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt"
          old=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$old" ] && git fetch -q --no-tags --depth=1 origin "$BRANCH"; then
            git worktree add -q --detach "$wt" FETCH_HEAD
          else
            git worktree add -q --detach "$wt" && git -C "$wt" rm -rqf . > /dev/null
          fi
          # a PR's page is replaced on every push, but not the snapshots of its earlier commits
          stash=""
          if [ "$KIND" = pr ] && [ -d "$wt/$DEST/commits" ]; then
            stash="$RUNNER_TEMP/kicad-hub-prcommits"
            rm -rf "$stash" && mv "$wt/$DEST/commits" "$stash"
          fi
          rm -rf "${wt:?}/$DEST" && mkdir -p "$(dirname "$wt/$DEST")" && cp -r "$site" "$wt/$DEST"
          if [ -n "$stash" ]; then
            mv "$stash" "$wt/$DEST/commits"
          fi
          if [ -n "$prc" ]; then
            rm -rf "${wt:?}/$PR_COMMIT_DEST" && mkdir -p "$(dirname "$wt/$PR_COMMIT_DEST")" && cp -r "$prc" "$wt/$PR_COMMIT_DEST"
          fi
          if [ -n "$hist" ]; then
            rm -rf "${wt:?}/$HIST_DEST" && mkdir -p "$(dirname "$wt/$HIST_DEST")" && cp -r "$hist" "$wt/$HIST_DEST"
          fi
          # activity.json first: index adds the activity page when it is there
          if [ -s "$act_raw" ]; then
            python3 "$GITHUB_ACTION_PATH/scripts/activity.py" publish --root "$wt" --data "$act_raw" --repo "$GITHUB_REPOSITORY"               --server "$GITHUB_SERVER_URL" "${push[@]}" || true
          fi
          # index also prunes history/ to the newest $keep snapshots and each PR's commits/ to the
          # newest $keep_pr (-1 = leave it alone)
          python3 "$GITHUB_ACTION_PATH/scripts/portal.py" index --root "$wt" --repo "$GITHUB_REPOSITORY" --server "$GITHUB_SERVER_URL" --keep-history "$keep" --keep-pr-commits "$keep_pr"
          git -C "$wt" checkout -q --orphan "site-$try"
          git -C "$wt" add -A
          git -C "$wt" -c user.name="github-actions[bot]" \
            -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Design portal: $LABEL (${SHA:0:7})"
          if git -C "$wt" push -q --force-with-lease="refs/heads/$BRANCH:$old" origin "HEAD:refs/heads/$BRANCH"; then
            ok=1; break
          fi
        done
        git worktree remove --force "$wt" 2>/dev/null || true
        if [ -n "$ok" ]; then
          if [ "${PORTAL_STATE:-unknown}" = disabled ]; then
            echo "Design portal published to branch $BRANCH, but GitHub Pages is not serving it (private repository without a paid plan, or Pages not enabled for that branch): see the README, section Design portal." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Design portal: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "::warning::Could not publish the design portal to $BRANCH (needs 'contents: write')"
        fi

    - name: Upload outputs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.detect.outputs.name }}-fab
        path: ${{ inputs.output-dir }}

    - name: Publish release
      if: github.ref_type == 'tag' && inputs.release == 'true' && steps.package.outputs.zip != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
        ZIP: ${{ steps.package.outputs.zip }}
      run: |
        set -uo pipefail
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" "$ZIP" --clobber
        else
          gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
        fi || echo "::warning::Could not publish the release (the workflow needs 'contents: write' permission)"

    - name: Strict mode
      if: inputs.strict == 'true'
      shell: bash
      env:
        ERC: ${{ steps.report.outputs.erc_errors }}
        DRC: ${{ steps.report.outputs.drc_errors }}
        REQS: ${{ steps.report.outputs.requirements_failed }}
      run: |
        fail=0
        [ "$ERC" = 0 ] || { echo "::error::ERC reports $ERC errors"; fail=1; }
        [ "$DRC" = 0 ] || [ "$DRC" = - ] || [ "$DRC" = null ] || { echo "::error::DRC reports $DRC errors"; fail=1; }
        [ "$REQS" = 0 ] || [ "$REQS" = - ] || [ "$REQS" = null ] || { echo "::error::$REQS requirements failed"; fail=1; }
        exit $fail
