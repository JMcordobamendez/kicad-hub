name: kicad-hub
description: ERC/DRC, BOM checks and diff, and fabrication outputs for a KiCad project, using KiBot.
author: JMcordobamendez

inputs:
  project-dir:
    description: Directory that contains the .kicad_pro file, relative to the repository root.
    required: true
  strict:
    description: Fail the job when ERC or DRC report errors. Keep false while the design is in progress.
    default: "false"
  required-fields:
    description: >-
      Symbol fields every fitted part must have, comma-separated. "A|B" means A or B is
      enough (e.g. an MPN or a distributor part number). DNP parts are skipped.
    default: "Footprint,Datasheet,MPN|LCSC"
  check-capacitor-voltage:
    description: Require a voltage rating on capacitors (a "Voltage" field, or a value like "10uF 16V").
    default: "true"
  datasheet-dirs:
    description: >-
      Extra folders (comma-separated, from the repo root) with datasheet files. Always
      searched too: datasheet(s)/ and docs/ next to the project, and datasheet(s)/ one
      level up. A file is used when its name contains the part's MPN or value.
    default: ""
  datasheet-optional-refs:
    description: Reference prefixes that don't need a datasheet (generic parts).
    default: "R,C,TP,H,MH,FID,JP,NT,LOGO"
  check-datasheet-links:
    description: Check that datasheet URLs respond (404 = broken; sites that block bots = unverified).
    default: "true"
  extra-formats:
    description: Extra board formats for the fab package, comma-separated (odb, ipc2581).
    default: ""
  release:
    description: On tags, publish the fab package as a GitHub Release asset (needs contents write).
    default: "true"
  comment:
    description: On pull requests, post the report as a comment (updated on every push).
    default: "true"
  github-token:
    description: Token used to comment on the pull request. Needs pull-requests write permission.
    default: ${{ github.token }}
  image:
    description: KiBot Docker image (headless KiCad).
    default: ghcr.io/inti-cmnb/kicad10_auto:1.9.1
  output-dir:
    description: Where outputs are written, relative to the repository root.
    default: fab

outputs:
  has-pcb:
    description: "true when the PCB has a board outline and PCB outputs were generated."
    value: ${{ steps.detect.outputs.has_pcb }}
  missing-fields:
    description: Number of fitted parts missing a required field.
    value: ${{ steps.report.outputs.missing_fields }}

runs:
  using: composite
  steps:
    - name: Detect project
      id: detect
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        set -euo pipefail
        pro=$(find "$PROJECT_DIR" -maxdepth 1 -name '*.kicad_pro' | head -n 1)
        if [ -z "$pro" ]; then
          echo "::error::No .kicad_pro found in $PROJECT_DIR"
          exit 1
        fi
        name=$(basename "$pro" .kicad_pro)
        pcb="$PROJECT_DIR/$name.kicad_pcb"
        # A board without anything on Edge.Cuts is still being drawn: skip PCB checks and outputs
        if [ -f "$pcb" ] && grep -q '(layer "Edge.Cuts")' "$pcb"; then
          has_pcb=true
        else
          has_pcb=false
          echo "::warning::$name has no board outline yet: skipping DRC and PCB outputs"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "has_pcb=$has_pcb" >> "$GITHUB_OUTPUT"

    - name: Pull KiBot image
      shell: bash
      run: docker pull --quiet "${{ inputs.image }}"

    - name: Register KiCad standard libraries
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        # kicad-cli starts with an empty config in a fresh container, so every symbol and
        # footprint from the standard libraries is reported as "library not found".
        # Give it the stock global lib tables in a HOME shared by all later steps.
        mkdir -p "$RUNNER_TEMP/kicad-home"
        docker run --rm -u "$(id -u):$(id -g)" -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" "$IMAGE" sh -c '
          for t in sym-lib-table fp-lib-table; do
            src=$(ls /usr/share/kicad/template/$t /usr/share/kicad/$t 2>/dev/null | head -n 1)
            [ -n "$src" ] || { echo "missing $t"; continue; }
            for v in $(ls /usr/share/kicad 2>/dev/null | grep -E "^[0-9]+\.[0-9]+$" || true) 10.0; do
              mkdir -p "$HOME/.config/kicad/$v" && cp "$src" "$HOME/.config/kicad/$v/"
            done
          done' | tee "$RUNNER_TEMP/kicad-libs.log"
        if grep -q missing "$RUNNER_TEMP/kicad-libs.log"; then
          echo "::warning::Standard KiCad library tables not found in $IMAGE: ERC/DRC will report library warnings"
        fi

    - name: ERC / DRC
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        NAME: ${{ steps.detect.outputs.name }}
        HAS_PCB: ${{ steps.detect.outputs.has_pcb }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -uo pipefail
        mkdir -p "$OUT/reports"
        kicad() { docker run --rm -u "$(id -u):$(id -g)" -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -w /w "$IMAGE" kicad-cli "$@"; }

        kicad sch erc --severity-all --format json -o "$OUT/reports/erc.json" "$PROJECT_DIR/$NAME.kicad_sch"
        kicad sch erc --severity-all --format report -o "$OUT/reports/erc.rpt" "$PROJECT_DIR/$NAME.kicad_sch"
        if [ "$HAS_PCB" = true ]; then
          kicad pcb drc --severity-all --schematic-parity --format json -o "$OUT/reports/drc.json" "$PROJECT_DIR/$NAME.kicad_pcb"
          kicad pcb drc --severity-all --schematic-parity --format report -o "$OUT/reports/drc.rpt" "$PROJECT_DIR/$NAME.kicad_pcb"
        fi

    - name: Per-part BOM (this commit and PR base)
      id: bom
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        NAME: ${{ steps.detect.outputs.name }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        REQUIRED: ${{ inputs.required-fields }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        kicad() { docker run --rm -u "$(id -u):$(id -g)" -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -w /w "$IMAGE" kicad-cli "$@"; }

        # Fields to export: fixed ones + every alternative named in required-fields
        labels="Reference,Value,Footprint,Datasheet,DNP,MPN,Manufacturer,Voltage"
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          case ",$labels," in *",$f,"*) ;; *) labels="$labels,$f" ;; esac
        done < <(echo "$REQUIRED" | tr ',|' '\n\n' | sed 's/^ *//;s/ *$//')
        fields=$(echo "$labels" | sed 's/\bDNP\b/${DNP}/')
        bom() { kicad sch export bom --fields "$fields" --labels "$labels" --group-by "" --ref-range-delimiter "" -o "$2" "$1"; }

        bom "$PROJECT_DIR/$NAME.kicad_sch" "$OUT/reports/bom-parts.csv"

        # On pull requests, the same BOM from the target branch, for the diff
        if [ -n "$BASE_SHA" ]; then
          base_dir=.kicad-hub-base
          if git fetch --no-tags --depth=1 origin "$BASE_SHA" && git worktree add --detach "$base_dir" FETCH_HEAD; then
            if [ -f "$base_dir/$PROJECT_DIR/$NAME.kicad_sch" ]; then
              bom "$base_dir/$PROJECT_DIR/$NAME.kicad_sch" "$OUT/reports/bom-parts-base.csv"
            else
              # board is new in this PR: every part counts as added
              head -n 1 "$OUT/reports/bom-parts.csv" > "$OUT/reports/bom-parts-base.csv"
            fi
            git worktree remove --force "$base_dir"
          else
            echo "::warning::Could not check out the PR base: BOM diff skipped"
          fi
        fi

    - name: Datasheets
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        OUT: ${{ inputs.output-dir }}
        DIRS: ${{ inputs.datasheet-dirs }}
        CHECK: ${{ inputs.check-datasheet-links }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/datasheets.py" --bom "$OUT/reports/bom-parts.csv" \
          --project-dir "$PROJECT_DIR" --dirs "$DIRS" --check-urls "$CHECK" \
          --out-dir "$OUT" --json "$OUT/reports/datasheets.json"

    - name: Fab package
      id: package
      if: steps.detect.outputs.has_pcb == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        NAME: ${{ steps.detect.outputs.name }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        EXTRA: ${{ inputs.extra-formats }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        run() { docker run --rm -u "$(id -u):$(id -g)" -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -w /w "$IMAGE" "$@"; }
        pcb="$PROJECT_DIR/$NAME.kicad_pcb"
        sch="$PROJECT_DIR/$NAME.kicad_sch"

        # Revision: the tag on releases, else the board's title block, else the commit
        rev=$(grep -oP '\(rev "\K[^"]+' "$pcb" | head -n 1 || true)
        [ "$REF_TYPE" != tag ] || rev="$REF_NAME"
        rev=${rev:-$(git rev-parse --short HEAD)}
        rev=$(printf '%s' "$rev" | tr -c 'A-Za-z0-9._-' '_')
        base="$NAME-$rev"
        pkg="$OUT/package/$base"
        mkdir -p "$pkg/gerber" "$pkg/drill" "$pkg/assembly"

        # Standard formats any fab accepts. Gerbers use the plot settings saved in the board.
        run kicad-cli pcb export gerbers --board-plot-params -o "$pkg/gerber/" "$pcb"
        run kicad-cli pcb export drill --excellon-separate-th --generate-map --map-format pdf \
            --excellon-units mm -o "$pkg/drill/" "$pcb"
        run kicad-cli pcb export ipcd356 -o "$pkg/$base.d356" "$pcb"
        run kicad-cli pcb export pos --format csv --units mm --side both --exclude-dnp \
            -o "$pkg/assembly/$base-cpl.csv" "$pcb"
        run kicad-cli sch export bom --exclude-dnp \
            --fields 'Reference,${QUANTITY},Value,Footprint,MPN,Manufacturer,LCSC' \
            --labels 'References,Qty,Value,Footprint,MPN,Manufacturer,LCSC' \
            --group-by 'Value,Footprint,MPN,Manufacturer,LCSC' \
            -o "$pkg/assembly/$base-bom.csv" "$sch"
        for fmt in $(printf '%s' "$EXTRA" | tr ',' ' '); do
          case "$fmt" in
            odb) run kicad-cli pcb export odb -o "$pkg/$base-odb.zip" "$pcb" ;;
            ipc2581) run kicad-cli pcb export ipc2581 -o "$pkg/$base-ipc2581.xml" "$pcb" ;;
            *) echo "::warning::Unknown extra format '$fmt' (use odb, ipc2581)" ;;
          esac
        done

        # Fab notes from the board (KiCad's Python, inside the image)
        cp "$GITHUB_ACTION_PATH/scripts/fabnotes.py" "$OUT/.fabnotes.py"
        run python3 "$OUT/.fabnotes.py" "$pcb" "$rev" "$pkg/README.txt" > "$OUT/reports/fab-warnings.txt"
        rm "$OUT/.fabnotes.py"
        while IFS= read -r w; do echo "::warning::$w"; done < "$OUT/reports/fab-warnings.txt"

        (cd "$pkg" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
        (cd "$OUT/package" && zip -qr "$base-fab.zip" "$base")
        echo "zip=$OUT/package/$base-fab.zip" >> "$GITHUB_OUTPUT"
        echo "name=$base-fab.zip" >> "$GITHUB_OUTPUT"

    - name: Report
      id: report
      shell: bash
      env:
        NAME: ${{ steps.detect.outputs.name }}
        OUT: ${{ inputs.output-dir }}
        REQUIRED: ${{ inputs.required-fields }}
        CAP_VOLTAGE: ${{ inputs.check-capacitor-voltage }}
        DS_OPTIONAL: ${{ inputs.datasheet-optional-refs }}
        PACKAGE: ${{ steps.package.outputs.name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail
        r="$OUT/reports"
        python3 "$GITHUB_ACTION_PATH/scripts/report.py" \
          --name "$NAME" --bom "$r/bom-parts.csv" --base-bom "$r/bom-parts-base.csv" --base-ref "${BASE_REF:-base}" \
          --erc "$r/erc.json" --drc "$r/drc.json" \
          --required "$REQUIRED" --cap-voltage "$CAP_VOLTAGE" \
          --datasheets "$r/datasheets.json" --datasheet-optional "$DS_OPTIONAL" \
          --package "$PACKAGE" --package-warnings "$r/fab-warnings.txt" \
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --out "$r/report.md" --out-json "$r/counts.json"
        cat "$r/report.md" >> "$GITHUB_STEP_SUMMARY"
        for k in erc_errors drc_errors missing_fields; do
          echo "$k=$(jq -r ".$k // \"-\"" "$r/counts.json")" >> "$GITHUB_OUTPUT"
        done

    - name: Comment on pull request
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NAME: ${{ steps.detect.outputs.name }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ inputs.output-dir }}/reports/report.md
      run: |
        set -uo pipefail
        # One comment per board, edited on every push instead of piling up new ones
        marker="<!-- kicad-hub:$NAME -->"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$REPORT" > /dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$REPORT" > /dev/null
        fi || echo "::warning::Could not comment on the PR (the workflow needs 'pull-requests: write' permission)"

    - name: Outputs (KiBot)
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        NAME: ${{ steps.detect.outputs.name }}
        HAS_PCB: ${{ steps.detect.outputs.has_pcb }}
        OUT: ${{ inputs.output-dir }}
        IMAGE: ${{ inputs.image }}
        CONFIG: ${{ github.action_path }}/kibot/default.kibot.yaml
      run: |
        set -euo pipefail
        # The action's own files are outside the workspace that gets mounted in the container
        cp "$CONFIG" "$OUT/.kibot.yaml"
        # Gerbers, drill and pick & place live in the fab package (previous step)
        targets="schematic_pdf bom_csv bom_html"
        pcb_args=()
        if [ "$HAS_PCB" = true ]; then
          targets="$targets ibom"
          pcb_args=(-b "$PROJECT_DIR/$NAME.kicad_pcb")
        fi
        # -s all: ERC/DRC already ran in a previous step
        docker run --rm -u "$(id -u):$(id -g)" -e HOME=/kh -v "$RUNNER_TEMP/kicad-home:/kh" -v "$PWD:/w" -w /w "$IMAGE" \
          kibot -c "$OUT/.kibot.yaml" -e "$PROJECT_DIR/$NAME.kicad_sch" "${pcb_args[@]}" \
                -d "$OUT" -s all $targets
        rm "$OUT/.kibot.yaml"

    - name: Upload outputs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.detect.outputs.name }}-fab
        path: ${{ inputs.output-dir }}

    - name: Publish release
      if: github.ref_type == 'tag' && inputs.release == 'true' && steps.package.outputs.zip != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
        ZIP: ${{ steps.package.outputs.zip }}
      run: |
        set -uo pipefail
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" "$ZIP" --clobber
        else
          gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
        fi || echo "::warning::Could not publish the release (the workflow needs 'contents: write' permission)"

    - name: Strict mode
      if: inputs.strict == 'true'
      shell: bash
      env:
        ERC: ${{ steps.report.outputs.erc_errors }}
        DRC: ${{ steps.report.outputs.drc_errors }}
      run: |
        fail=0
        [ "$ERC" = 0 ] || { echo "::error::ERC reports $ERC errors"; fail=1; }
        [ "$DRC" = 0 ] || [ "$DRC" = - ] || [ "$DRC" = null ] || { echo "::error::DRC reports $DRC errors"; fail=1; }
        exit $fail
