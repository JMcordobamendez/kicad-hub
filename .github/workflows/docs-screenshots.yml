name: Docs screenshots

# Takes the screenshots in docs/screenshots/ from a published PR page of the portal.
# Run it by hand on a PR with visual changes; download the artifact and commit the PNGs.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose portal page and comment to capture
        required: true
      extra:
        description: 'Extra pages to capture, "name=url name=url" (optional)'
        default: ""
  push:
    branches: [docs/screenshots]
    paths: [.github/workflows/docs-screenshots.yml, .github/scripts/screenshots.mjs]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Screenshots
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || '24' }}
          EXTRA: ${{ inputs.extra || 'compare=https://jmcordobamendez.github.io/kicad-hub/compare.html?a=pr-23/&b=pr-24/ pins=https://jmcordobamendez.github.io/kicad-hub/pr-21/#pcb' }}
        run: |
          SITE=$(echo "$SITE" | sed 's#//\([^.]*\)#//\L\1#')
          mkdir -p shots && SITE="$SITE" node .github/scripts/screenshots.mjs
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
