# When a pull request is closed, removes what kicad-hub published for it:
#  - its before/after images in kicad-hub-images (old PR comments keep showing them:
#    they link to the commit that added them, which stays in the branch history)
#  - its preview in the design portal (kicad-hub-site)
name: Clean up PR outputs

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose outputs to remove
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Remove pr-<N>/ from kicad-hub-images
        run: |
          set -euo pipefail
          git init -q images && cd images
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch -q --depth=1 origin kicad-hub-images; then
            echo "No kicad-hub-images branch: nothing to clean"; exit 0
          fi
          git checkout -q FETCH_HEAD
          if [ ! -d "pr-$PR" ]; then
            echo "No images for PR #$PR"; exit 0
          fi
          git rm -rq "pr-$PR"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
            commit -qm "PR #$PR closed: remove its images"
          git push -q origin HEAD:refs/heads/kicad-hub-images
          echo "Removed the images of PR #$PR"

      - name: Remove pr-<N>/ from the design portal (kicad-hub-site)
        run: |
          set -euo pipefail
          git init -q site && cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          old=$(git ls-remote origin refs/heads/kicad-hub-site | cut -f1)
          if [ -z "$old" ]; then
            echo "No kicad-hub-site branch: nothing to clean"; exit 0
          fi
          git fetch -q --depth=1 origin kicad-hub-site
          git checkout -q FETCH_HEAD
          if [ ! -d "pr-$PR" ]; then
            echo "No portal page for PR #$PR"; exit 0
          fi
          rm -rf "pr-$PR"
          # the front page lists what's in builds.json: rebuild it from the build.json left
          find . -name build.json -not -path './.git/*' | sort | while read -r f; do
            d=${f#./}; jq --arg p "${d%/build.json}/" '. + {path: $p}' "$f"
          done | jq -s . > builds.json
          # one commit, like the action publishes it
          git checkout -q --orphan site
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
            commit -qm "PR #$PR closed: remove its portal page"
          git push -q --force-with-lease="refs/heads/kicad-hub-site:$old" origin HEAD:refs/heads/kicad-hub-site
          echo "Removed the portal page of PR #$PR"
