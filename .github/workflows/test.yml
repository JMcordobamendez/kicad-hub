name: Test action

on:
  push:
    branches: [main]
    # vX.Y.Z: action versions (not the moving major tag v1, same commit as its vX.Y.Z)
    # example-*: test the release step
    tags: ["v*.*.*", "example-*"]
  pull_request:

permissions:
  contents: write        # release asset on tags, before/after images on PRs
  pull-requests: write   # the action comments its report on PRs
  issues: read           # the activity page reads the issues commits and PRs mention

jobs:
  # Fast tests of the scripts that have them (no KiCad needed)
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  app:
    # The desktop app (app/): its page in Chromium and its core's unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Page tests
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node app/tests/ui.test.mjs
      - name: Core tests (Rust)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
          cargo test --manifest-path app/src-tauri/Cargo.toml

  royalblue54l-feather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./
        with:
          # No project-dir: the example is the only KiCad project in this repository, so
          # this run also tests that the action finds it by itself
          # Only example-* tags attach the example's fab package to a release
          release: ${{ startsWith(github.ref_name, 'example-') }}
          currency: EUR
          fab-profile: jlcpcb
          # Optional suppliers: set these secrets in this repo to test them
          mouser-api-key: ${{ secrets.MOUSER_API_KEY }}
          farnell-api-key: ${{ secrets.FARNELL_API_KEY }}
          farnell-store: es.farnell.com
          digikey-client-id: ${{ secrets.DIGIKEY_CLIENT_ID }}
          digikey-client-secret: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
