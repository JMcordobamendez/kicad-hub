name: Test action

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write        # publish the fab package as a release asset on tags
  pull-requests: write   # the action comments its report on PRs

jobs:
  royalblue54l-feather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./
        with:
          project-dir: examples/royalblue54l-feather
