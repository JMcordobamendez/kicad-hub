name: Test action

on:
  push:
    branches: [main]
    # vX.Y.Z: action versions (not the moving major tag v1, same commit as its vX.Y.Z)
    # example-*: test the release step
    tags: ["v*.*.*", "example-*"]
  pull_request:

permissions:
  contents: write        # release asset on tags, before/after images on PRs
  pull-requests: write   # the action comments its report on PRs

jobs:
  royalblue54l-feather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./
        with:
          project-dir: examples/royalblue54l-feather
          # Only example-* tags attach the example's fab package to a release
          release: ${{ startsWith(github.ref_name, 'example-') }}
          currency: EUR
          fab-profile: jlcpcb
          # Optional suppliers: set these secrets in this repo to test them
          mouser-api-key: ${{ secrets.MOUSER_API_KEY }}
          farnell-api-key: ${{ secrets.FARNELL_API_KEY }}
          farnell-store: es.farnell.com
          digikey-client-id: ${{ secrets.DIGIKEY_CLIENT_ID }}
          digikey-client-secret: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
