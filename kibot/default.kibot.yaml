# Default KiBot outputs used by the kicad-hub action.
# ERC/DRC are run separately with kicad-cli, so KiBot is always called with `-s all`.
kibot:
  version: 1

outputs:
  # --- From the schematic -------------------------------------------------
  - name: schematic_pdf
    comment: Schematic as a single PDF
    type: pdf_sch_print
    dir: schematic

  - name: bom_csv
    comment: Bill of materials (CSV)
    type: bom
    dir: bom
    options:
      format: CSV

  - name: bom_html
    comment: Bill of materials (HTML)
    type: bom
    dir: bom
    options:
      format: HTML

  # --- From the PCB (only when the board has an outline) ------------------
  - name: ibom
    comment: Interactive BOM
    type: ibom
    dir: ibom

  - name: gerbers
    comment: Gerbers
    type: gerber
    dir: gerbers
    layers:
      - copper
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - F.Paste
      - B.Paste
      - Edge.Cuts

  - name: drill
    comment: Drill files
    type: excellon
    dir: gerbers

  - name: position
    comment: Pick and place
    type: position
    dir: assembly
