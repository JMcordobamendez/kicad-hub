# Requirements checked by kicad-hub on every run (see "Requirements" in the README).
# R1-R6 describe this board and pass; R7 FAILS ON PURPOSE so the example shows what a
# failed requirement looks like in the report and the portal.
- id: R1
  text: Two copper layers at most
  check: max_layers
  max: 2

- id: R2
  text: Board fits in 60 x 40 mm
  check: max_board_size
  width: 60
  height: 40

- id: R3
  text: No parts obsolete at every supplier
  check: no_bad_lifecycle

- id: R4
  text: Tracks of 0.15 mm or wider
  check: min_track
  min: 0.15

- id: R5
  text: Every IC has a datasheet link
  check: required_fields
  refs: 'U\d+'
  fields: [Datasheet]

- id: R6
  text: No linear regulators of the 78xx family
  check: forbidden_parts
  pattern: '78\d\d'

- id: R7
  text: "Fewer than 10 fitted parts (fails on purpose, the board has far more)"
  check: max_parts
  max: 10
