# Requirements for this board, checked by kicad-hub on every push and pull request
# and shown as a pass/fail table in the report. Remove the "#" from the ones you want.
# Without this file nothing is checked. Every check type is described at
# https://github.com/JMcordobamendez/kicad-hub#requirements

# - id: R1
#   text: Cost per board under 15 EUR at 100 units
#   check: max_cost
#   batch: 100              # must be one of the `boards` input (default 1,5,10,100)
#   max: 15                 # in the `currency` input's currency
#   # variant: Lite         # a design variant; default is the default build
#
# - id: R2
#   text: No ERC errors
#   check: erc_errors_max   # max: 0 by default
#
# - id: R3
#   text: No DRC errors
#   check: drc_errors_max
#
# - id: R4
#   text: Two copper layers at most
#   check: max_layers
#   max: 2
#
# - id: R5
#   text: Board fits in 50 x 30 mm
#   check: max_board_size
#   width: 50
#   height: 30
#
# - id: R6
#   text: All parts in stock for 100 boards
#   check: in_stock
#   batch: 100
#
# - id: R7
#   text: No obsolete parts
#   check: no_bad_lifecycle
#
# - id: R8
#   text: Fabricable with 0.15 mm tracks and 0.3 mm drills
#   check: min_track
#   min: 0.15
#   # a second entry with `check: min_drill` and `min: 0.3`
#
# - id: R9
#   text: Every IC has an MPN and a datasheet
#   check: required_fields
#   refs: 'U\d+'            # regular expression matched against the whole reference
#   fields: [MPN, Datasheet]
#
# - id: R10
#   text: Fewer than 120 parts
#   check: max_parts
#   max: 120
